<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Games · NordgrenLabs</title>
<script>try{var p=localStorage.getItem('nl-games-theme');document.documentElement.dataset.theme=p==='light'||p==='dark'?p:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <main style="padding-top: 52px">
    <h1>Games</h1>

    <a class="glass tile" href="bank/index.html">
      <strong>Bank</strong>
      <span>A push-your-luck dice game for two or more. Bring your own dice or roll on screen.</span>
    </a>
    <a class="glass tile" href="tidevault/index.html" style="margin-top: 14px">
      <strong>Tidevault</strong>

    <div class="account" id="account" style="margin-top: 24px" hidden></div>
  </main>
