<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose face-up cards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.s{--canvas:#f6f3ec;--solid:#fff;--ink:#1d1d1f;--ink2:#6e6e73;--accent:#0071e3;--primary:#0071e3;--glass:rgba(255,255,255,.62);--edge:rgba(255,255,255,.8);--hair:rgba(60,60,67,.14);--fill:rgba(120,120,128,.13);--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 40px rgba(0,0,0,.08);--card:#fff;--red:#c8102e;--blk:#1d1d1f;--num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;background:var(--canvas);color:var(--ink);font:17px/1.4 var(--text);-webkit-font-smoothing:antialiased}
.s *{box-sizing:border-box}
.s::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px 360px at 0% 0%,rgba(230,90,40,.16),transparent 60%),radial-gradient(360px 320px at 100% 22%,rgba(241,179,0,.14),transparent 60%),radial-gradient(420px 360px at 70% 100%,rgba(31,115,218,.12),transparent 60%)}
.s>*{position:relative;z-index:1}
.s>.menu{position:absolute;top:24px;right:12px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.glass{background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--edge);border-radius:22px;box-shadow:var(--shadow),inset 0 1px 0 var(--edge)}
.s button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.btn{min-height:44px;padding:0 18px;border-radius:999px;background:var(--fill);font-weight:600;font-size:16px}
.btn.primary{min-height:54px;background:var(--primary);color:#fff;font-size:18px}
.cap{margin:0;font-size:13px;font-weight:600;color:var(--ink2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--fill);font-size:13px;font-weight:600}
.c{position:relative;flex:none;display:block;width:56px;height:80px;border-radius:9px;background:var(--card);color:var(--blk);box-shadow:0 1px 0 rgba(0,0,0,.06),0 3px 10px rgba(0,0,0,.14),inset 0 0 0 1px rgba(0,0,0,.07);font-family:var(--num);text-align:left}
.c.r{color:var(--red)}
.c .i{position:absolute;top:5px;left:6px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:17px;line-height:1;letter-spacing:-.05em}
.c .i small{font-size:13px;margin-top:2px;letter-spacing:0}
.c .m{position:absolute;right:6px;bottom:5px;font-size:28px;line-height:1}
.c.md{width:64px;height:92px;border-radius:10px}.c.md .i{font-size:19px;top:6px;left:7px}.c.md .i small{font-size:15px}.c.md .m{font-size:32px;right:7px;bottom:6px}
.c.pick{box-shadow:0 0 0 3px var(--accent),0 6px 16px rgba(0,0,0,.18)}
.ck{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px var(--canvas)}
.back{background:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 2px,transparent 2px 7px),var(--pc);box-shadow:inset 0 0 0 3px var(--pc),inset 0 0 0 4.5px rgba(255,255,255,.75),0 3px 10px rgba(0,0,0,.16)}
.back::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 3px var(--pc),0 0 0 4.5px rgba(255,255,255,.6)}
.slot{position:relative;width:64px;height:106px;flex:none}
.slot>.c{position:absolute;left:0}
.slot>.back{top:0}.slot>.up{top:14px}
</style>
</helmet>
<div class="s" style="width: 390px; height: 844px; padding: 24px 16px 16px; display: flex; flex-direction: column; gap: 14px; --pc: #1f6fd6">
<button class="glass menu" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>

<div style="padding-right: 58px; display: flex; flex-direction: column; gap: 8px; min-height: 48px; justify-content: center">
<span class="pill" style="align-self: flex-start"><span style="width: 10px; height: 10px; border-radius: 50%; background: #1f6fd6"></span>Only Alex should look</span>
</div>
<h1 style="margin: 0; font: 800 28px/1.15 var(--num); letter-spacing: -.02em">Alex, pick your four face-up cards</h1>
<p style="margin: 0; color: var(--ink2); font-size: 15px">They go on your table, over your four face-down cards. The other five are your hand.</p>

<section class="glass" style="padding: 14px 14px 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">Your table</h2>
<span class="cap">Tap two to swap places</span>
</div>
<div style="display: flex; justify-content: space-between; margin-top: 12px; padding: 0 6px">
<sc-for list="{{table}}" as="k" hint-placeholder-count="4"><div class="slot"><div class="c md back"></div><button class="{{k.cls}} up" aria-label="{{k.name}}, table spot {{k.n}}"><span class="i">{{k.r}}<small>{{k.s}}</small></span><span class="m">{{k.s}}</span></button></div></sc-for>
</div>
</section>

<div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">Your nine cards</h2>
<span class="cap" style="color: var(--accent)">4 of 4 chosen</span>
</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px 6px; justify-items: center; padding-top: 6px">
<sc-for list="{{nine}}" as="k" hint-placeholder-count="9"><button class="{{k.cls}}" aria-label="{{k.name}}" aria-pressed="{{k.pressed}}"><span class="i">{{k.r}}<small>{{k.s}}</small></span><span class="m">{{k.s}}</span><sc-if value="{{k.pick}}" hint-placeholder-val="{{ false }}"><span class="ck"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"></path></svg></span></sc-if></button></sc-for>
</div>

<div style="flex: 1"></div>
<p style="margin: 0; text-align: center; font-size: 14px; color: var(--ink2)">Your cards are hidden before Brooke chooses.</p>
<button class="btn primary">Confirm and hide</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const SU = { S: ['♠︎', 'spades', 0], H: ['♥︎', 'hearts', 1], D: ['♦︎', 'diamonds', 1], C: ['♣︎', 'clubs', 0] };
    const RN = { A: 'Ace', K: 'King', Q: 'Queen', J: 'Jack' };
    const card = (code, extra) => { const r = code.slice(0, -1), u = SU[code.slice(-1)]; return { r, s: u[0], name: (RN[r] || r) + ' of ' + u[1], cls: 'c md' + (u[2] ? ' r' : '') + (extra ? ' ' + extra : '') }; };
    const picked = ['AS', 'KH', '10C', '2D'];
    return {
      table: picked.map((c, i) => ({ ...card(c), n: i + 1 })),
      nine: ['AS', 'KH', '10C', '2D', '4C', '6H', '7S', '9D', 'JH'].map((c) => {
        const pick = picked.includes(c);
        return { ...card(c, pick ? 'pick' : ''), pick, pressed: pick ? 'true' : 'false' };
      })
    };
  }
}
</script>
</body>
</html>
