<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table, phone landscape</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.s{--ink:#1d1d1f;--ink2:#5f5f64;--primary:#0071e3;--glass:rgba(255,255,255,.9);--edge:rgba(255,255,255,.8);--hair:rgba(60,60,67,.14);--fill:rgba(120,120,128,.13);--shadow:0 1px 2px rgba(0,0,0,.08),0 10px 30px rgba(0,0,0,.18);--on:#fff;--on2:#d4e8db;--card:#fff;--red:#c8102e;--blk:#1d1d1f;--num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;background:radial-gradient(ellipse 90% 110% at 50% 40%,#27704a,#1d5a39 75%);color:var(--on);font:17px/1.4 var(--text);-webkit-font-smoothing:antialiased}
.s *{box-sizing:border-box}
.s::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1.3px);background-size:4px 4px}
.s>*{position:relative;z-index:1}
.s>.menu{position:absolute;top:12px;right:20px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;z-index:3}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--edge);border-radius:16px;box-shadow:var(--shadow);color:var(--ink)}
.s button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.btn.primary{min-height:52px;padding:0 16px;border-radius:999px;background:var(--primary);color:#fff;font-weight:600;font-size:17px}
.cap{margin:0;font-size:12px;font-weight:600;color:var(--ink2)}
.on2{margin:0;font-size:12px;font-weight:600;color:var(--on2)}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:800 11px var(--num);flex:none}
.opp{display:flex;align-items:center;gap:8px;padding:6px 10px;min-height:44px}
.opp.now{box-shadow:0 0 0 3px var(--pc),0 0 0 5.5px rgba(255,255,255,.92),var(--shadow)}
.felt{position:relative;border-radius:999px;background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.07),rgba(0,0,0,.08) 70%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12),inset 0 4px 24px rgba(0,0,0,.22)}
.spot{position:absolute;width:76px;display:flex;flex-direction:column;align-items:center;gap:3px}
.who{display:inline-flex;align-items:center;gap:4px;padding:1px 7px 1px 4px;border-radius:999px;background:var(--glass);color:var(--ink);font-size:12px;font-weight:700;line-height:16px;white-space:nowrap}
.who i{width:10px;height:10px;border-radius:50%}
.ttag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);z-index:2;padding:1px 7px;border-radius:999px;background:var(--glass);color:var(--ink);font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.ttag.w{background:#1d1d1f;color:#fff}
.hole{width:56px;height:80px;border-radius:9px;border:2px dashed rgba(255,255,255,.45)}
.c{position:relative;flex:none;display:block;width:56px;height:80px;border-radius:9px;background:var(--card);color:var(--blk);box-shadow:0 1px 0 rgba(0,0,0,.06),0 3px 10px rgba(0,0,0,.25),inset 0 0 0 1px rgba(0,0,0,.07);font-family:var(--num);text-align:left}
.c.r{color:var(--red)}
.c .i{position:absolute;top:5px;left:6px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:17px;line-height:1;letter-spacing:-.05em}
.c .i small{font-size:13px;margin-top:2px;letter-spacing:0}
.c .m{position:absolute;right:6px;bottom:5px;font-size:28px;line-height:1}
.c .art{position:absolute;right:4px;bottom:4px;width:60%;height:70%}
.c.md{width:62px;height:88px;border-radius:10px}.c.md .i{font-size:19px;top:6px;left:7px}.c.md .i small{font-size:15px}.c.md .m{font-size:30px}
.c.win{box-shadow:0 0 0 3px #ffd23f,0 6px 18px rgba(0,0,0,.35)}
.c.up{transform:translateY(-10px)}
.c.sel{transform:translateY(-20px);box-shadow:0 0 0 3px #fff,0 0 0 5.5px #1d1d1f,0 14px 26px rgba(0,0,0,.35)}
.c.no{background:#d7d7d2;color:#3a3a3c}
.c.no.r{color:#9e1a2c}
.hrow{display:flex;padding-top:20px}
.hrow .c+.c{margin-left:-14px}
.sc{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px;align-items:center;min-height:26px;font-size:14px;font-weight:600}
.sc b{font:800 15px var(--num);font-variant-numeric:tabular-nums}
.ptag{display:inline-flex;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:800}
</style>
</helmet>
<div class="s" style="width: 844px; height: 390px; padding: 12px 20px 10px; display: grid; grid-template-columns: 196px minmax(0, 1fr) 170px; grid-template-rows: minmax(0, 1fr) auto; gap: 8px 12px">
<button class="glass menu" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>

<div style="display: flex; flex-direction: column; gap: 6px; min-height: 0">
<div style="padding: 0 2px 2px">
<h1 style="margin: 0; font: 800 22px/1.1 var(--num)">Your turn</h1>
<p class="on2">Round 2 of 6 · No Hearts<br>Hearts 10 each · Trick 4 of 13</p>
</div>
<section class="glass opp" style="--pc: #cf6900" aria-label="Brooke, 9 cards, 20 points"><span class="av" style="background: #cf6900; color: #1d1d1f">B</span><strong style="flex: 1; font-size: 14px">Brooke</strong><span class="cap">9 · 20 pts</span></section>
<section class="glass opp" style="--pc: #1c7f3e" aria-label="Sam, 9 cards, 0 points"><span class="av" style="background: #1c7f3e; color: #fff">S</span><strong style="flex: 1; font-size: 14px">Sam</strong><span class="cap">9 · 0 pts</span></section>
<section class="glass opp" style="--pc: #9850dc" aria-label="Dana, 9 cards, 10 points"><span class="av" style="background: #9850dc; color: #fff">D</span><strong style="flex: 1; font-size: 14px">Dana</strong><span class="cap">9 · 10 pts</span></section>
</div>

<section class="felt" aria-label="Table: 3 of 4 cards played" style="min-height: 0">
<div class="spot" style="left: calc(50% - 38px); top: 4px"><span class="c r" role="img" aria-label="Sam played the 4 of hearts"><span class="i">4<small>♥︎</small></span><span class="m">♥︎</span></span><span class="who"><i style="background: #1c7f3e"></i>Sam</span></div>
<div class="spot" style="left: 14px; top: 70px"><span class="c r" role="img" aria-label="Brooke led the 9 of hearts"><span class="ttag">Led</span><span class="i">9<small>♥︎</small></span><span class="m">♥︎</span></span><span class="who"><i style="background: #cf6900"></i>Brooke</span></div>
<div class="spot" style="right: 14px; top: 70px"><span class="c r win" role="img" aria-label="Dana played the Queen of hearts, winning"><span class="ttag w">Winning</span><span class="i">Q<small>♥︎</small></span><svg class="art" viewBox="0 0 40 56" aria-hidden="true"><rect x="1.5" y="1.5" width="37" height="53" rx="4" fill="none" stroke="currentColor" stroke-opacity=".35"></rect><path d="M12.5 18 Q20 10 27.5 18 Z" fill="currentColor"></path><circle cx="13" cy="13" r="1.6" fill="currentColor"></circle><circle cx="20" cy="9.5" r="1.8" fill="currentColor"></circle><circle cx="27" cy="13" r="1.6" fill="currentColor"></circle><circle cx="20" cy="26" r="6" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="M13 24 Q12 36 17 37 M27 24 Q28 36 23 37" fill="none" stroke="currentColor" stroke-width="1.6"></path><path d="M7 54 Q8 40 20 39 Q32 40 33 54" fill="none" stroke="currentColor" stroke-width="1.6"></path><circle cx="20" cy="45" r="2" fill="currentColor"></circle></svg></span><span class="who"><i style="background: #9850dc"></i>Dana</span></div>
<div class="spot" style="left: calc(50% - 38px); bottom: 2px"><span class="hole" aria-hidden="true"></span><span class="who"><i style="background: #1f6fd6"></i>You</span></div>
<div class="glass" style="position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); padding: 4px 12px; border-radius: 999px; text-align: center"><span class="cap" style="font-size: 11px; display: block; line-height: 1.1">Lead suit</span><strong style="font: 800 15px/1.2 var(--num)"><span style="color: #c8102e">♥︎</span> Hearts</strong></div>
</section>

<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 52px; min-height: 0">
<section class="glass" style="padding: 8px 10px" aria-label="Scores">
<p class="cap" style="margin-bottom: 2px">Total · lowest is best</p>
<div class="sc"><span class="av" style="background: #1c7f3e; color: #fff">S</span><span>Sam</span><b>20</b></div>
<div class="sc"><span class="av" style="background: #1f6fd6; color: #fff">A</span><span>You</span><b>40</b></div>
<div class="sc"><span class="av" style="background: #9850dc; color: #fff">D</span><span>Dana</span><b>50</b></div>
<div class="sc"><span class="av" style="background: #cf6900; color: #1d1d1f">B</span><span>Brooke</span><b>60</b></div>
</section>
<div style="flex: 1"></div>
<button class="btn primary" aria-label="Play the 3 of hearts">Play 3♥︎</button>
</div>

<section aria-label="Your hand" style="grid-column: 1 / -1; display: flex; align-items: flex-end; gap: 12px">
<div style="width: 140px; flex: none; padding-bottom: 6px">
<div style="display: flex; align-items: center; gap: 6px"><span class="av" style="background: #1f6fd6; color: #fff">A</span><strong style="font-size: 14px">Alex · 10</strong></div>
<span class="ptag" style="background: #1f6fd6; color: #fff; margin-top: 4px">Your turn</span>
<p class="on2" style="margin-top: 4px">Follow hearts: 3 playable</p>
</div>
<div class="hrow" style="flex: 1; justify-content: center">
<sc-for list="{{hand}}" as="k" hint-placeholder-count="10"><button class="{{k.cls}}" aria-label="{{k.aria}}" aria-pressed="{{k.pressed}}" disabled="{{k.off}}"><span class="i">{{k.r}}<small>{{k.s}}</small></span><sc-if value="{{k.pip}}" hint-placeholder-val="{{ true }}"><span class="m">{{k.s}}</span></sc-if><sc-if value="{{k.isK}}" hint-placeholder-val="{{ false }}"><svg class="art" viewBox="0 0 40 56" aria-hidden="true"><rect x="1.5" y="1.5" width="37" height="53" rx="4" fill="none" stroke="currentColor" stroke-opacity=".35"></rect><path d="M11 19 L12.5 9 L16.5 14 L20 7 L23.5 14 L27.5 9 L29 19 Z" fill="currentColor"></path><circle cx="20" cy="26" r="6" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="M15 30 Q20 38 25 30" fill="none" stroke="currentColor" stroke-width="1.6"></path><path d="M7 54 Q7 39 20 38 Q33 39 33 54" fill="none" stroke="currentColor" stroke-width="1.6"></path><path d="M20 42 L20 54" stroke="currentColor" stroke-width="1.2"></path></svg></sc-if><sc-if value="{{k.isQ}}" hint-placeholder-val="{{ false }}"><svg class="art" viewBox="0 0 40 56" aria-hidden="true"><rect x="1.5" y="1.5" width="37" height="53" rx="4" fill="none" stroke="currentColor" stroke-opacity=".35"></rect><path d="M12.5 18 Q20 10 27.5 18 Z" fill="currentColor"></path><circle cx="13" cy="13" r="1.6" fill="currentColor"></circle><circle cx="20" cy="9.5" r="1.8" fill="currentColor"></circle><circle cx="27" cy="13" r="1.6" fill="currentColor"></circle><circle cx="20" cy="26" r="6" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="M13 24 Q12 36 17 37 M27 24 Q28 36 23 37" fill="none" stroke="currentColor" stroke-width="1.6"></path><path d="M7 54 Q8 40 20 39 Q32 40 33 54" fill="none" stroke="currentColor" stroke-width="1.6"></path><circle cx="20" cy="45" r="2" fill="currentColor"></circle></svg></sc-if><sc-if value="{{k.isJ}}" hint-placeholder-val="{{ false }}"><svg class="art" viewBox="0 0 40 56" aria-hidden="true"><rect x="1.5" y="1.5" width="37" height="53" rx="4" fill="none" stroke="currentColor" stroke-opacity=".35"></rect><path d="M12 19 L28 19 L26.5 12 Q20 8 13.5 12 Z" fill="currentColor"></path><path d="M26.5 12 Q33 7 32 16" fill="none" stroke="currentColor" stroke-width="1.6"></path><circle cx="20" cy="26" r="6" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="M7 54 Q7 40 20 39 Q33 40 33 54" fill="none" stroke="currentColor" stroke-width="1.6"></path><path d="M14 39 L20 45 L26 39" fill="none" stroke="currentColor" stroke-width="1.4"></path></svg></sc-if></button></sc-for>
</div>
<button class="on2" style="min-height: 44px; padding: 0 4px; color: var(--on); flex: none; width: 60px" aria-label="Sort hand, now by suit then rank">Sort: suit</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    const SU = { S: ['♠︎', 'spades', 0], H: ['♥︎', 'hearts', 1], D: ['♦︎', 'diamonds', 1], C: ['♣︎', 'clubs', 0] };
    const RN = { A: 'Ace', K: 'King', Q: 'Queen', J: 'Jack' };
    const hand = ['AS', '10S', '5S', 'KH', '7H', '3H', 'QC', '6C', 'JD', '8D'].map((code) => {
      const r = code.slice(0, -1), su = code.slice(-1), u = SU[su], ok = su === 'H', sel = code === '3H';
      return { r, s: u[0], isK: r === 'K', isQ: r === 'Q', isJ: r === 'J', pip: !['K', 'Q', 'J'].includes(r),
        cls: 'c md' + (u[2] ? ' r' : '') + (sel ? ' sel' : ok ? ' up' : ' no'), off: !ok, pressed: sel ? 'true' : 'false',
        aria: (RN[r] || r) + ' of ' + u[1] + (sel ? ', selected' : ok ? ', playable' : ", can't be played") };
    });
    return { hand };
  }
}
</script>
</body>
</html>
