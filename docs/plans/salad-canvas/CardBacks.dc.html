<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card back</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.s{--canvas:#f6f3ec;--ink:#1d1d1f;--ink2:#6e6e73;--accent:#0071e3;--primary:#0071e3;--glass:rgba(255,255,255,.62);--edge:rgba(255,255,255,.8);--hair:rgba(60,60,67,.14);--fill:rgba(120,120,128,.13);--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 40px rgba(0,0,0,.08);--num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;background:var(--canvas);color:var(--ink);font:17px/1.4 var(--text);-webkit-font-smoothing:antialiased}
.s *{box-sizing:border-box}
.s::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px 360px at 0% 0%,rgba(26,107,64,.16),transparent 60%),radial-gradient(420px 360px at 100% 100%,rgba(31,115,218,.12),transparent 60%)}
.s>*{position:relative;z-index:1}
.s>.menu{position:absolute;top:24px;right:12px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.glass{background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--edge);border-radius:20px;box-shadow:var(--shadow),inset 0 1px 0 var(--edge)}
.s button,.s a.btn{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-decoration:none}
.btn{min-height:48px;padding:0 16px;border-radius:999px;background:var(--fill);font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{min-height:56px;background:var(--primary);color:#fff;font-size:18px}
.cap{margin:0;font-size:13px;font-weight:600;color:var(--ink2)}
.lbl{display:flex;justify-content:space-between;margin:0 0 6px;font-size:14px;font-weight:700}
.lbl span{font-weight:500;color:var(--ink2);font-size:13px}
.c{position:relative;flex:none;display:block;width:84px;height:120px;border-radius:12px;background:#fff;color:#c8102e;box-shadow:0 1px 0 rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.2),inset 0 0 0 1px rgba(0,0,0,.07);font-family:var(--num);text-align:left}
.c .i{position:absolute;top:8px;left:9px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:24px;line-height:1}
.c .i small{font-size:19px;margin-top:2px}
.c .art{position:absolute;right:7px;bottom:7px;width:60%;height:70%}
.back{background-color:var(--pc);box-shadow:inset 0 0 0 5px var(--pc),inset 0 0 0 7px rgba(255,255,255,.75),0 4px 12px rgba(0,0,0,.2)}
.mini{width:40px;height:56px;border-radius:6px;box-shadow:inset 0 0 0 3px var(--pc),inset 0 0 0 4px rgba(255,255,255,.75),0 2px 6px rgba(0,0,0,.18)}
.p-stripes{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.24) 0 3px,transparent 3px 9px)}
.p-waves{background-image:radial-gradient(circle at 50% 100%,transparent 0 4px,rgba(255,255,255,.32) 4px 6px,transparent 6px),radial-gradient(circle at 50% 0,transparent 0 4px,rgba(255,255,255,.32) 4px 6px,transparent 6px);background-size:12px 7px;background-position:0 0,6px 3.5px}
.p-diamonds{background-image:conic-gradient(from 45deg,rgba(255,255,255,.26) 0 25%,transparent 0 50%,rgba(255,255,255,.26) 0 75%,transparent 0);background-size:12px 12px;background-position:center}
.p-crosshatch{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.24) 0 1.5px,transparent 1.5px 7px),repeating-linear-gradient(-45deg,rgba(255,255,255,.24) 0 1.5px,transparent 1.5px 7px)}
.p-dots{background-image:radial-gradient(circle,rgba(255,255,255,.34) 1.6px,transparent 2px);background-size:8px 8px}
.p-plain{background-image:none}
.preset{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;padding:8px 4px;border-radius:14px;font-size:12px;font-weight:700}
.preset[aria-pressed="true"]{background:#fff;box-shadow:0 0 0 2px #1d1d1f}
.sw{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;justify-items:center}
.sw button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--canvas),0 0 0 5px var(--ink)}
.pat{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.pat button{height:48px;border-radius:10px;background-color:#62738a;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.pat button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--canvas),0 0 0 4px var(--ink)}
</style>
</helmet>
<div class="s" style="width: 390px; height: 844px; padding: 24px 16px 20px; display: flex; flex-direction: column; gap: 10px">
<button class="glass menu" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
<div style="min-height: 48px; padding-right: 58px; display: flex; align-items: center; gap: 8px">
<a class="btn" href="Settings.dc.html" aria-label="Back to settings" style="width: 44px; min-height: 44px; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div><h1 style="margin: 0; font: 800 24px/1.1 var(--num)">Card back</h1><p class="cap" style="font-weight: 500">How backs look on your screen only</p></div>
</div>

<section class="glass" style="padding: 14px; display: flex; justify-content: center; gap: 16px; align-items: center" aria-label="Preview">
<span class="{{previewCls}}" style="--pc: {{hex}}; transform: rotate(-6deg)" role="img" aria-label="Preview: {{label}}"></span>
<span class="c" style="transform: rotate(5deg)" aria-hidden="true"><span class="i">Q<small>♥︎</small></span><svg class="art" viewBox="0 0 40 56"><rect x="1.5" y="1.5" width="37" height="53" rx="4" fill="none" stroke="currentColor" stroke-opacity=".35"></rect><path d="M12.5 18 Q20 10 27.5 18 Z" fill="currentColor"></path><circle cx="13" cy="13" r="1.6" fill="currentColor"></circle><circle cx="20" cy="9.5" r="1.8" fill="currentColor"></circle><circle cx="27" cy="13" r="1.6" fill="currentColor"></circle><circle cx="20" cy="26" r="6" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="M13 24 Q12 36 17 37 M27 24 Q28 36 23 37" fill="none" stroke="currentColor" stroke-width="1.6"></path><path d="M7 54 Q8 40 20 39 Q32 40 33 54" fill="none" stroke="currentColor" stroke-width="1.6"></path><circle cx="20" cy="45" r="2" fill="currentColor"></circle></svg></span>
<span class="cap" style="font-weight: 500; width: 92px">{{label}}</span>
</section>

<section class="glass" style="padding: 12px 14px; display: flex; flex-direction: column; gap: 12px">
<div>
<p class="lbl">Presets</p>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px" role="group" aria-label="Preset backs">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="6"><button class="preset" aria-pressed="{{p.pressed}}" aria-label="{{p.name}}" onClick="{{p.pick}}"><span class="{{p.cls}}" style="--pc: {{p.hex}}"></span></button></sc-for>
</div>
</div>
<div>
<p class="lbl">Colour <span>{{colourName}}</span></p>
<div class="sw" role="group" aria-label="Back colour">
<sc-for list="{{colours}}" as="c" hint-placeholder-count="12"><button style="background: {{c.hex}}; color: {{c.ink}}" aria-label="{{c.name}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}"><sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></button></sc-for>
</div>
</div>
<div>
<p class="lbl">Pattern <span>{{patternName}}</span></p>
<div class="pat" role="group" aria-label="Back pattern">
<sc-for list="{{patterns}}" as="p" hint-placeholder-count="6"><button class="{{p.cls}}" aria-label="{{p.name}}" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}"></button></sc-for>
</div>
</div>
</section>

<section class="glass" style="padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<button class="btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 16l-5-5-8 8"></path></svg>Upload from this device</button>
<p class="cap" style="font-weight: 500">JPG, PNG or WebP up to 2 MB. It is redrawn as a small picture, kept only on this device and never sent to other players. SVG is not accepted.</p>
</section>

<div style="flex: 1"></div>
<button class="btn primary">Use this back</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { colour: 12, pattern: 2 }; }
  renderVals() {
    const C = [['Cobalt', '#1f6fd6', '#fff'], ['Tangerine', '#cf6900', '#1d1d1f'], ['Forest', '#1c7f3e', '#fff'], ['Violet', '#9850dc', '#fff'], ['Teal', '#0c7c78', '#fff'], ['Rose', '#cc2f7c', '#fff'],
      ['Gold', '#b07f00', '#1d1d1f'], ['Indigo', '#6064e0', '#fff'], ['Scarlet', '#d42f3a', '#fff'], ['Slate', '#62738a', '#fff'], ['Sky', '#1f93c9', '#1d1d1f'], ['Lime', '#62970f', '#1d1d1f'], ['Felt', '#1d5a39', '#fff']];
    const PT = [['stripes', 'Stripes'], ['waves', 'Waves'], ['diamonds', 'Diamonds'], ['crosshatch', 'Crosshatch'], ['dots', 'Dots'], ['plain', 'Plain']];
    const PR = [['Felt Diamonds', 12, 2], ['Cobalt Stripes', 0, 0], ['Tangerine Waves', 1, 1], ['Violet Crosshatch', 3, 3], ['Slate Dots', 9, 4], ['Rose Plain', 5, 5]];
    const { colour, pattern } = this.state;
    return {
      hex: C[colour][1], label: C[colour][0] + ' ' + PT[pattern][1], colourName: C[colour][0], patternName: PT[pattern][1],
      previewCls: 'c back p-' + PT[pattern][0],
      presets: PR.map(([name, c, p]) => ({ name, hex: C[c][1], cls: 'mini back p-' + PT[p][0], pressed: c === colour && p === pattern ? 'true' : 'false', pick: () => this.setState({ colour: c, pattern: p }) })),
      colours: C.slice(0, 12).map(([name, hex, ink], i) => ({ name, hex, ink, on: i === colour, pressed: i === colour ? 'true' : 'false', pick: () => this.setState({ colour: i }) })),
      patterns: PT.map(([k, name], i) => ({ name, cls: 'p-' + k, pressed: i === pattern ? 'true' : 'false', pick: () => this.setState({ pattern: i }) }))
    };
  }
}
</script>
</body>
</html>
