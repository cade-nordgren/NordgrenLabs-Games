<helmet>
<style>
body{margin:0}
.s{--canvas:#f6f3ec;--ink:#1d1d1f;--ink2:#6e6e73;--accent:#0071e3;--primary:#0071e3;--felt:#1a6b40;--glass:rgba(255,255,255,.62);--edge:rgba(255,255,255,.8);--hair:rgba(60,60,67,.14);--fill:rgba(120,120,128,.13);--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 40px rgba(0,0,0,.08);--card:#fff;--red:#c8102e;--blk:#1d1d1f;--num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;background:var(--canvas);color:var(--ink);font:17px/1.4 var(--text);-webkit-font-smoothing:antialiased}
.s *{box-sizing:border-box}
.s::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px 360px at 0% 0%,rgba(26,107,64,.18),transparent 60%),radial-gradient(360px 320px at 100% 40%,rgba(240,124,27,.13),transparent 60%),radial-gradient(420px 360px at 50% 100%,rgba(31,115,218,.14),transparent 60%)}
.s>*{position:relative;z-index:1}
.s>.menu{position:absolute;top:24px;right:12px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.glass{background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--edge);border-radius:22px;box-shadow:var(--shadow),inset 0 1px 0 var(--edge)}
.s button,.s a.btn{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-decoration:none}
.btn{min-height:50px;padding:0 18px;border-radius:999px;background:var(--fill);font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{min-height:56px;background:var(--primary);color:#fff;font-size:18px}
.cap{margin:0;font-size:13px;font-weight:600;color:var(--ink2)}
.felt{background:radial-gradient(ellipse at 50% 42%,#27704a,#1d5a39 78%);border-radius:999px;box-shadow:inset 0 0 0 6px rgba(0,0,0,.12),inset 0 2px 18px rgba(0,0,0,.35)}
.c{position:relative;flex:none;display:block;width:56px;height:80px;border-radius:9px;background:var(--card);color:var(--blk);box-shadow:0 1px 0 rgba(0,0,0,.06),0 3px 10px rgba(0,0,0,.18),inset 0 0 0 1px rgba(0,0,0,.07);font-family:var(--num);text-align:left}
.c.r{color:var(--red)}
.c .i{position:absolute;top:5px;left:6px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:17px;line-height:1;letter-spacing:-.05em}
.c .i small{font-size:13px;margin-top:2px;letter-spacing:0}
.c .m{position:absolute;right:6px;bottom:5px;font-size:28px;line-height:1}
.c .art{position:absolute;right:5px;bottom:5px;width:60%;height:70%}
.c.xl{width:84px;height:120px;border-radius:12px}.c.xl .i{font-size:24px;top:8px;left:9px}.c.xl .i small{font-size:19px}.c.xl .art{right:8px;bottom:8px}
.back{background-color:var(--pc);box-shadow:inset 0 0 0 4px var(--pc),inset 0 0 0 5.5px rgba(255,255,255,.75),0 3px 10px rgba(0,0,0,.2)}
.p-stripes{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.24) 0 3px,transparent 3px 9px)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;text-decoration:none;color:inherit}
</style>
</helmet>
<div class="s" style="width: 390px; height: 844px; padding: 24px 16px 20px; display: flex; flex-direction: column; gap: 14px">
<button class="glass menu" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
<div style="height: 48px"></div>

<span class="c xl" style="position: absolute; left: 110px; top: 14px; transform: rotate(12deg)"><span class="i">K<small>♠︎</small></span><svg class="art" viewBox="0 0 40 56" aria-hidden="true"><rect x="1.5" y="1.5" width="37" height="53" rx="4" fill="none" stroke="currentColor" stroke-opacity=".35"></rect><path d="M11 19 L12.5 9 L16.5 14 L20 7 L23.5 14 L27.5 9 L29 19 Z" fill="currentColor"></path><circle cx="20" cy="26" r="6" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="M15 30 Q20 38 25 30" fill="none" stroke="currentColor" stroke-width="1.6"></path><path d="M7 54 Q7 39 20 38 Q33 39 33 54" fill="none" stroke="currentColor" stroke-width="1.6"></path><path d="M20 42 L20 54" stroke="currentColor" stroke-width="1.2"></path></svg></span>
</div>
</div>
<h1 style="margin: 16px 0 0; text-align: center; font: 800 38px/1.05 var(--num); letter-spacing: -.02em">Canadian Salad</h1>
<p style="margin: 6px 0 2px; text-align: center; color: var(--ink2); font-size: 16px">Six rounds of tricks. Lowest score wins.</p>
</section>
