<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table themes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.s{--canvas:#f6f3ec;--ink:#1d1d1f;--ink2:#6e6e73;--accent:#0071e3;--glass:rgba(255,255,255,.62);--edge:rgba(255,255,255,.8);--hair:rgba(60,60,67,.14);--fill:rgba(120,120,128,.13);--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 40px rgba(0,0,0,.08);--num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;background:var(--canvas);color:var(--ink);font:17px/1.4 var(--text);-webkit-font-smoothing:antialiased}
.s *{box-sizing:border-box}
.s::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px 360px at 0% 0%,rgba(26,107,64,.18),transparent 60%),radial-gradient(420px 360px at 100% 100%,rgba(240,124,27,.12),transparent 60%)}
.s>*{position:relative;z-index:1}
.s>.menu{position:absolute;top:24px;right:12px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.glass{background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--edge);border-radius:20px;box-shadow:var(--shadow),inset 0 1px 0 var(--edge)}
.s button,.s a.btn{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-decoration:none;text-align:left}
.btn{min-height:44px;padding:0 16px;border-radius:999px;background:var(--fill);font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center}
.cap{margin:0;font-size:13px;font-weight:600;color:var(--ink2)}
.tile{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:18px}
.tile[aria-pressed="true"]{box-shadow:0 0 0 3px #1d1d1f,var(--shadow)}
.mini{position:relative;height:96px;border-radius:14px;overflow:hidden;background:radial-gradient(ellipse 110% 90% at 50% 40%,var(--b),var(--a) 78%);padding:8px 10px;color:var(--t)}
.mini b{display:block;font:800 14px/1.1 var(--num)}
.mini small{display:block;font-size:11px;font-weight:600;color:var(--t2)}
.cards{position:absolute;right:10px;bottom:10px;display:flex;gap:5px}
.c{position:relative;display:block;width:30px;height:43px;border-radius:5px;background:#fff;color:#c8102e;box-shadow:0 2px 5px rgba(0,0,0,.3),inset 0 0 0 1px rgba(0,0,0,.08);font:800 12px/1 var(--num)}
.c span{position:absolute;top:3px;left:4px;text-align:center}
.bk{background-color:#1f6fd6;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.24) 0 2px,transparent 2px 6px);box-shadow:inset 0 0 0 2px #1f6fd6,inset 0 0 0 3px rgba(255,255,255,.75),0 2px 5px rgba(0,0,0,.3)}
.who{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:4px;padding:1px 7px 1px 4px;border-radius:999px;background:rgba(255,255,255,.9);color:#1d1d1f;font-size:11px;font-weight:700}
.who i{width:9px;height:9px;border-radius:50%;background:#cf6900}
.light .c{box-shadow:0 1px 3px rgba(0,0,0,.2),inset 0 0 0 1px #8a867c}
.wood{background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 2px,transparent 2px 11px),radial-gradient(ellipse 110% 90% at 50% 40%,var(--b),var(--a) 78%)}
.sig{background-image:radial-gradient(90px 70px at 15% 10%,rgba(240,124,27,.35),transparent 70%),radial-gradient(90px 70px at 90% 100%,rgba(31,115,218,.4),transparent 70%),radial-gradient(ellipse 110% 90% at 50% 40%,var(--b),var(--a) 78%)}
.nm{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:700;padding:0 2px;min-height:22px}
.toggle{width:51px;height:31px;border-radius:999px;background:#1a6b40;position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:22px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
</style>
</helmet>
<div class="s" style="width: 390px; height: 844px; padding: 24px 16px 20px; display: flex; flex-direction: column; gap: 10px">
<button class="glass menu" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
<div style="min-height: 48px; padding-right: 58px; display: flex; align-items: center; gap: 8px">
<a class="btn" href="Settings.dc.html" aria-label="Back to settings" style="width: 44px; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div><h1 style="margin: 0; font: 800 24px/1.1 var(--num)">Table</h1><p class="cap" style="font-weight: 500">The host picks the room's table</p></div>
</div>

<div role="group" aria-label="Table theme" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="7">
<button class="glass tile" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}">
<span class="{{t.cls}}" style="--a: {{t.a}}; --b: {{t.b}}; --t: {{t.t}}; --t2: {{t.t2}}" aria-hidden="true">
<b>Your turn</b><small>Trick 4 of 13</small>
<span class="who"><i></i>Brooke</span>
<span class="cards"><span class="c"><span>Q<br>♥︎</span></span><span class="c bk"></span></span>
</span>
<span class="nm">{{t.name}}<sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></span>
</button>
</sc-for>
<section class="glass" style="padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; justify-content: center">
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700">Use my own on this device<button class="toggle" role="switch" aria-checked="true" aria-label="Use my own table on this device"></button></label>
<p class="cap" style="font-weight: 500; font-size: 12px">Room default: Green Felt</p>
</section>
</div>
<p class="cap" style="font-weight: 500; text-align: center">Every table keeps 4.5:1 text, white cards and player colours readable on it.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pick: 0 }; }
  renderVals() {
    // [name, edge, centre, ink, ink2, extra class] all measured in contrast.js
    const T = [['Classic Green Felt', '#1d5a39', '#27704a', '#ffffff', '#d4e8db', ''], ['Dark Charcoal', '#26282c', '#35383d', '#ffffff', '#c9ccd1', ''],
      ['Navy Blue', '#182a4a', '#22395f', '#ffffff', '#c8d4ea', ''], ['Warm Wood', '#5e3920', '#70452a', '#ffffff', '#efd9c4', ' wood'],
      ['Minimal Light', '#e9e6df', '#f2f0ea', '#1d1d1f', '#55555a', ' light'], ['Minimal Dark', '#141416', '#1f1f22', '#f5f5f7', '#a8a8ad', ''],
      ['NordgrenLabs Signature', '#1b2040', '#262c55', '#ffffff', '#cdd2ee', ' sig']];
    return { themes: T.map(([name, a, b, t, t2, x], i) => ({ name, a, b, t, t2, cls: 'mini' + x, on: i === this.state.pick, pressed: i === this.state.pick ? 'true' : 'false', pick: () => this.setState({ pick: i }) })) };
  }
}
</script>
</body>
</html>
